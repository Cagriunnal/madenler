                    <option value="Kırık">Kırık</option>

                    <option value="">-- Tüm Madenler --</option>
                </select>
            </div>
        </div>

                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>

    </div>

        // Extract all unique minerals mentioned in the notes for the select dropdown
        var mineralsSet = new Set();
        for (var province in seninNotlarin) {
            var note = seninNotlarin[province];
            var match = note.match(/<b>Önemli Madenler:<\/b>\s*([^<]+)/i) || note.match(/<b>Madenler:<\/b>\s*([^<]+)/i);
            if (match && match[1]) {
                var items = match[1].split(',');
                items.forEach(function(item) {
                    // Clean up mineral names (remove parentheticals and extra spaces)
                    var cleanItem = item.replace(/\(.*?\)/g, '').trim();
                    if (cleanItem) {
                        // Capitalize properly
                        mineralsSet.add(cleanItem);
                    }
                });
            }
        }

        // Populate minerals dropdown
        var madenSelect = document.getElementById("madenFilter");
        var sortedMinerals = Array.from(mineralsSet).sort(function(a, b) {
            return a.localeCompare(b, 'tr');
        });
        sortedMinerals.forEach(function(mineral) {
            var opt = document.createElement("option");
            opt.value = mineral;
            opt.textContent = mineral;
            madenSelect.appendChild(opt);
        });

        var chart = am4core.create("harita-alani", am4maps.MapChart);
        chart.geodata = am4geodata_turkeyLow; 
        chart.projection = new am4maps.projections.Mercator();
        chart.seriesContainer.draggable = false;
        chart.seriesContainer.resizable = false;
        chart.maxZoomLevel = 1; 

        var polygonSeries = chart.series.push(new am4maps.MapPolygonSeries());
        polygonSeries.useGeodata = true;

        var template = polygonSeries.mapPolygons.template;
        template.fill = am4core.color("#D3D3D3"); 
        template.stroke = am4core.color("#FFFFFF"); 
        template.strokeWidth = 1.5;

        var hoverState = template.states.create("hover");
        hoverState.properties.fill = am4core.color("#8D1F2D"); 

        polygonSeries.tooltip = new am4core.Tooltip();
        polygonSeries.tooltip.pointerOrientation = "vertical"; 
        polygonSeries.tooltip.getFillFromObject = false; 
        polygonSeries.tooltip.background.fill = am4core.color("#ffffff"); 
        polygonSeries.tooltip.background.stroke = am4core.color("#8D1F2D"); 
        polygonSeries.tooltip.background.strokeWidth = 2;
        
        template.adapter.add("tooltipHTML", function(html, target) {
            if (target.dataItem && target.dataItem.dataContext) {
                var ilAdi = target.dataItem.dataContext.name;
                var temizAd = ilAdi.replace('â', 'a').replace('î', 'i');
                var not = seninNotlarin[temizAd] || seninNotlarin[ilAdi] || "Veri yok.";
                
                return '<div style="padding: 10px; width: 250px; white-space: normal; text-align: left; color: black;">' +
                       '<b style="color: #8D1F2D; font-size: 16px; display: block; border-bottom: 1px solid #eee; margin-bottom: 5px;">' + ilAdi + '</b>' +
                       '<span style="font-size: 14px; line-height: 1.4;">' + not + '</span>' +
                       '</div>';
            }
            return html;
        });

        chart.logo.disabled = true;

        var resetBtn = document.getElementById("resetBtn");

        function updateMapColors() {
            var selectedOlusum = olusumFilter.value.toLowerCase();
            var selectedMaden = madenSelect.value.toLowerCase();

            polygonSeries.mapPolygons.each(function(polygon) {
                var ilAdi = polygon.dataItem.dataContext.name;
                var temizAd = ilAdi.replace('â', 'a').replace('î', 'i');
                var note = (seninNotlarin[temizAd] || seninNotlarin[ilAdi] || "").toLowerCase();

                var matchesOlusum = true;
                if (selectedOlusum) {
                    if (selectedOlusum === "kıvrım") {
                        // Check if it has kıvrım and not solely exclusively something else without kıvrım
                        matchesOlusum = note.includes("kıvrım");
                    } else if (selectedOlusum === "kırık") {
                        matchesOlusum = note.includes("kırık");
                    }
                }

                var matchesMaden = true;
                if (selectedMaden) {
                    matchesMaden = note.includes(selectedMaden);
                }

                // If both filters are active, require matching both criteria
                var shouldHighlight = false;
                if (selectedOlusum && selectedMaden) {
                    shouldHighlight = matchesOlusum && matchesMaden;
                } else if (selectedOlusum) {
                    shouldHighlight = matchesOlusum;
                } else if (selectedMaden) {
                    shouldHighlight = matchesMaden;
                } else {
                    shouldHighlight = false; // Neither selected
                }

                if (selectedOlusum === "" && selectedMaden === "") {
                    polygon.fill = am4core.color("#D3D3D3");
                } else if (shouldHighlight) {
                    polygon.fill = am4core.color("#8D1F2D");
                } else {
                    polygon.fill = am4core.color("#D3D3D3");
                }
            });
        }

        olusumFilter.addEventListener("change", function() {
            updateMapColors();
        });

        madenSelect.addEventListener("change", function() {
            updateMapColors();
        });

        resetBtn.addEventListener("click", function() {
            olusumFilter.value = "";
            madenSelect.value = "";
            polygonSeries.mapPolygons.each(function(polygon) {
                polygon.fill = am4core.color("#D3D3D3");
            });
        });
    </script>
</body>
</html>
